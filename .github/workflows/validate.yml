name: Validate

# Links, frontmatter, attribution and #1's hazard rules (#26). The script is
# standard-library Python, so the job needs nothing beyond the runner's python3.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1" # Mondays: report dead external links
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 .github/scripts/validate.py

  external-links:
    # Reports 404/410s in the job summary; never fails a run.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 .github/scripts/validate.py --external
